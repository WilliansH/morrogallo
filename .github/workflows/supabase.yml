# Aplica las migraciones de supabase/migrations en cada push a main.
#
# Supabase anota en la base qué migraciones ya corrió, así que cada una se
# aplica UNA vez: las siguientes veces este workflow no hace nada con ellas.
#
# Necesita dos secretos en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  — supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — Supabase → Project Settings → Database
name: Supabase — migraciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migraciones
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROYECTO: vtsvwvrbdwnomfisoygn
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enlazar el proyecto
        run: supabase link --project-ref "$PROYECTO" --password "$SUPABASE_DB_PASSWORD"

      - name: Qué se va a aplicar
        id: plan
        run: |
          supabase db push --dry-run 2>&1 | tee plan.txt
          if grep -q "limpiar_para_produccion" plan.txt; then
            echo "limpiar=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar migraciones
        run: supabase db push --yes

      # Solo el push en que entra la migración de limpieza: las fotos no se
      # pueden borrar desde SQL, así que se vacía el bucket por la API.
      - name: Vaciar el bucket de fotos (solo con la limpieza)
        if: steps.plan.outputs.limpiar == 'si'
        run: supabase storage rm -r "ss:///fotos" --experimental --linked --yes
